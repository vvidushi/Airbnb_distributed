version: '3.8'

services:
  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: airbnb-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - airbnb-network
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka Message Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: airbnb-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - airbnb-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  # MySQL Database (Legacy - for backward compatibility)
  mysql:
    image: mysql:8.0
    container_name: airbnb-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_DATABASE: airbnb_db
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airbnb-network

  # MongoDB Database (Primary - Lab 2 Part 3)
  mongodb:
    image: mongo:7.0
    container_name: airbnb-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: airbnb_mongo_2024
      MONGO_INITDB_DATABASE: airbnb_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airbnb-network

  # Backend Service (Handles Traveler, Owner, Property, Booking services)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airbnb-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ""
      DB_NAME: airbnb_db
      SESSION_SECRET: airbnb_secret_key_dev
      INTERNAL_API_KEY: airbnb_internal_key_2024
      KAFKA_BROKER: kafka:9092
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USER: admin
      MONGO_PASSWORD: airbnb_mongo_2024
      MONGO_DATABASE: airbnb_db
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - airbnb-network
    restart: unless-stopped

  # Kafka Producer Service (Frontend Service - produces events)
  kafka-producer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airbnb-kafka-producer
    command: ["node", "src/kafka/producer-service.js"]
    ports:
      - "5001:5001"
    environment:
      NODE_ENV: development
      PRODUCER_PORT: 5001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ""
      DB_NAME: airbnb_db
      SESSION_SECRET: airbnb_secret_key_dev
      KAFKA_BROKER: kafka:9092
      FRONTEND_URL: http://frontend
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - airbnb-network
    restart: unless-stopped

  # Kafka Consumer Service (Backend Service - consumes events)
  kafka-consumer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airbnb-kafka-consumer
    command: ["node", "src/kafka/consumer-service.js"]
    environment:
      NODE_ENV: development
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ""
      DB_NAME: airbnb_db
      KAFKA_BROKER: kafka:9092
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - airbnb-network
    restart: unless-stopped

  # AI Agent Service
  ai-agent:
    build:
      context: ./ai-agent
      dockerfile: Dockerfile
    container_name: airbnb-ai-agent
    ports:
      - "8000:8000"
    environment:
      BACKEND_URL: http://backend:5000
      INTERNAL_API_KEY: airbnb_internal_key_2024
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      OPENAI_MODEL: gpt-3.5-turbo
      OPENAI_TEMPERATURE: 0.3
      OPENAI_MAX_TOKENS: 2000
    depends_on:
      - backend
    networks:
      - airbnb-network
    restart: unless-stopped

  # Frontend Service (Nginx serving React build)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: airbnb-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
      - ai-agent
    networks:
      - airbnb-network
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local
  mongodb_data:
    driver: local

networks:
  airbnb-network:
    driver: bridge

