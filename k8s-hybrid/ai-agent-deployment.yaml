apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-agent-config
  namespace: airbnb-lab
data:
  BACKEND_URL: "http://backend-service:5000"
  INTERNAL_API_KEY: "airbnb_internal_key_2024"
  OPENAI_MODEL: "gpt-3.5-turbo"
  OPENAI_TEMPERATURE: "0.3"
  OPENAI_MAX_TOKENS: "2000"
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-agent-secret
  namespace: airbnb-lab
type: Opaque
stringData:
  # IMPORTANT: Add your actual API keys here
  OPENAI_API_KEY: "your-openai-key-here"
  TAVILY_API_KEY: "your-tavily-key-here"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent
  namespace: airbnb-lab
  labels:
    app: ai-agent
    service: airbnb-ai-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-agent
  template:
    metadata:
      labels:
        app: ai-agent
        service: airbnb-ai-agent
    spec:
      containers:
      - name: ai-agent
        image: 868812196149.dkr.ecr.us-east-1.amazonaws.com/airbnb/ai-agent:lab2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: ai-agent-config
        - secretRef:
            name: ai-agent-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ai-agent-service
  namespace: airbnb-lab
  labels:
    app: ai-agent
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: ai-agent

