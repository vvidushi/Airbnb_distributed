# ConfigMap for Backend to connect to LOCAL databases
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: airbnb-lab
data:
  PORT: "5000"
  # IMPORTANT: Replace 73.241.126.204 with your actual public IP
  # Get it with: curl -s https://ifconfig.me
  DB_HOST: "73.241.126.204"
  DB_PORT: "3306"
  DB_NAME: "airbnb_db"
  DB_USER: "root"
  NODE_ENV: "production"
  SESSION_SECRET: "airbnb_secret_key_production_2024"
  INTERNAL_API_KEY: "airbnb_internal_key_2024"
  FRONTEND_URL: "http://frontend-service"
  KAFKA_BROKER: "kafka-service:9092"
  # MongoDB connection to LOCAL machine
  MONGO_HOST: "73.241.126.204"
  MONGO_PORT: "27017"
  MONGO_DATABASE: "airbnb_db"
  MONGO_USER: "admin"
---
# ConfigMap for Kafka Producer
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-producer-config
  namespace: airbnb-lab
data:
  PRODUCER_PORT: "5001"
  DB_HOST: "73.241.126.204"
  DB_PORT: "3306"
  DB_NAME: "airbnb_db"
  DB_USER: "root"
  NODE_ENV: "production"
  SESSION_SECRET: "airbnb_secret_key_production_2024"
  KAFKA_BROKER: "kafka-service:9092"
  FRONTEND_URL: "http://frontend-service"
---
# ConfigMap for Kafka Consumer
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-consumer-config
  namespace: airbnb-lab
data:
  DB_HOST: "73.241.126.204"
  DB_PORT: "3306"
  DB_NAME: "airbnb_db"
  DB_USER: "root"
  NODE_ENV: "production"
  KAFKA_BROKER: "kafka-service:9092"

