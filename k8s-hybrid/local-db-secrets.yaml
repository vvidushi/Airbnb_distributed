# Secrets for LOCAL database passwords
# These match your local MySQL and MongoDB credentials

apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: airbnb-lab
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "root"  # Your local MySQL password
---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: airbnb-lab
type: Opaque
stringData:
  MONGO_INITDB_ROOT_PASSWORD: "airbnb_mongo_2024"  # Your local MongoDB password

