apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-producer-config
  namespace: airbnb-lab
data:
  PRODUCER_PORT: "5001"
  KAFKA_BROKER: kafka-service:9092
  DB_HOST: mysql-service
  DB_PORT: "3306"
  DB_NAME: airbnb_db
  DB_USER: root
  NODE_ENV: production
  SESSION_SECRET: airbnb_secret_key_production_2024
  FRONTEND_URL: http://frontend-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-producer
  namespace: airbnb-lab
  labels:
    app: kafka-producer
    service: producer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kafka-producer
  template:
    metadata:
      labels:
        app: kafka-producer
        service: producer
    spec:
      containers:
      - name: kafka-producer
        image: airbnb-backend:latest
        imagePullPolicy: IfNotPresent
        command: ["node", "src/kafka/producer-service.js"]
        ports:
        - containerPort: 5001
          name: http
        envFrom:
        - configMapRef:
            name: kafka-producer-config
        env:
        - name: DB_PASSWORD
          value: ""
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5001
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-producer-service
  namespace: airbnb-lab
  labels:
    app: kafka-producer
spec:
  type: ClusterIP
  ports:
  - port: 5001
    targetPort: 5001
    protocol: TCP
    name: http
  selector:
    app: kafka-producer

