# Optimized Docker Compose for AWS EC2 Deployment
# Target: m7i-flex.large (8GB RAM, 2 vCPU)

version: '3.8'

services:
  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: airbnb-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - airbnb-network
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Kafka Message Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: airbnb-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xmx1G -Xms1G"
    networks:
      - airbnb-network
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: airbnb-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-airbnb_mongo_2024}
      MONGO_INITDB_DATABASE: airbnb_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - airbnb-network
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airbnb-backend
    ports:
      - "5001:5000"
      - "80:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_TYPE: sqlite
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USER: admin
      MONGO_PASSWORD: ${MONGO_PASSWORD:-airbnb_mongo_2024}
      MONGO_DATABASE: airbnb_db
      SESSION_SECRET: ${SESSION_SECRET:-airbnb_production_secret_change_me}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-airbnb_internal_key_2024}
      KAFKA_BROKER: kafka:9092
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    volumes:
      - ./backend/uploads:/app/uploads
      - sqlite_data:/data
    networks:
      - airbnb-network
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Kafka Producer Service
  kafka-producer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airbnb-kafka-producer
    command: ["node", "src/kafka/producer-service.js"]
    ports:
      - "5002:5001"
    environment:
      NODE_ENV: production
      PRODUCER_PORT: 5001
      DB_TYPE: sqlite
      SESSION_SECRET: ${SESSION_SECRET:-airbnb_production_secret_change_me}
      KAFKA_BROKER: kafka:9092
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    volumes:
      - sqlite_data:/data
    networks:
      - airbnb-network
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # Kafka Consumer Service
  kafka-consumer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airbnb-kafka-consumer
    command: ["node", "src/kafka/consumer-service.js"]
    environment:
      NODE_ENV: production
      DB_TYPE: sqlite
      KAFKA_BROKER: kafka:9092
    volumes:
      - sqlite_data:/data
    networks:
      - airbnb-network
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # AI Agent Service
  ai-agent:
    build:
      context: ./ai-agent
      dockerfile: Dockerfile
    container_name: airbnb-ai-agent
    ports:
      - "8000:8000"
    environment:
      BACKEND_URL: http://backend:5000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-airbnb_internal_key_2024}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-3.5-turbo}
      OPENAI_TEMPERATURE: ${OPENAI_TEMPERATURE:-0.3}
      OPENAI_MAX_TOKENS: ${OPENAI_MAX_TOKENS:-1500}
    depends_on:
      - backend
    networks:
      - airbnb-network
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:5001}
        REACT_APP_AI_URL: ${REACT_APP_AI_URL:-http://localhost:8000}
    container_name: airbnb-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - airbnb-network
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

volumes:
  sqlite_data:
    driver: local
  mongodb_data:
    driver: local

networks:
  airbnb-network:
    driver: bridge

