# Optimized Docker Compose for AWS EC2 Deployment
# Target: t2.small (2GB RAM, 1 vCPU)
# Database: SQLite (file-based) + MongoDB Atlas (external)

version: '3.8'

services:
  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: airbnb-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      # Aggressive memory optimization for bare bones
      KAFKA_HEAP_OPTS: "-Xmx64m -Xms64m"
    ports:
      - "2181:2181"
    networks:
      - airbnb-network
    deploy:
      resources:
        limits:
          memory: 128M  # Reduced from 256MB
          cpus: '0.2'
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Kafka Message Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: airbnb-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Aggressive memory optimization for bare bones
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
      KAFKA_LOG_RETENTION_HOURS: 1  # Keep logs for just 1 hour
      KAFKA_LOG_SEGMENT_BYTES: 10485760  # Smaller segments (10MB)
    networks:
      - airbnb-network
    deploy:
      resources:
        limits:
          memory: 384M  # Increased from 256MB for stability
          cpus: '0.3'
        reservations:
          memory: 192M
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # MongoDB Database (for sessions and additional features)
  mongodb:
    image: mongo:7.0
    container_name: airbnb-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-airbnb_mongo_2024}
      MONGO_INITDB_DATABASE: airbnb_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - airbnb-network
    deploy:
      resources:
        limits:
          memory: 512M  # Increased to support 256MB cache
          cpus: '0.15'
        reservations:
          memory: 256M
    command: mongod --wiredTigerCacheSizeGB 0.25  # Minimum for MongoDB 7.0
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend Service (Main API with SQLite)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airbnb-backend
    ports:
      - "5001:5000"
      - "80:5000"  # Also expose on port 80 for easy access
    environment:
      NODE_ENV: production
      PORT: 5000
      # SQLite - file-based, no external DB needed
      DB_TYPE: sqlite
      # MongoDB - local container
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USER: admin
      MONGO_PASSWORD: ${MONGO_PASSWORD:-airbnb_mongo_2024}
      MONGO_DATABASE: airbnb_db
      # Session configuration
      SESSION_SECRET: ${SESSION_SECRET:-airbnb_production_secret_change_me}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-airbnb_internal_key_2024}
      # Kafka configuration
      KAFKA_BROKER: kafka:9092
      # Frontend URL for CORS
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # Node.js memory optimization
      NODE_OPTIONS: "--max-old-space-size=256"
    volumes:
      - ./backend/uploads:/app/uploads
      - sqlite_data:/data  # Mount for SQLite database file
    networks:
      - airbnb-network
    deploy:
      resources:
        limits:
          memory: 320M  # Reduced from 512MB (bare bones API)
          cpus: '0.4'
        reservations:
          memory: 192M
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Kafka Producer Service
  kafka-producer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airbnb-kafka-producer
    command: ["node", "src/kafka/producer-service.js"]
    ports:
      - "5002:5001"
    environment:
      NODE_ENV: production
      PRODUCER_PORT: 5001
      DB_TYPE: sqlite
      SESSION_SECRET: ${SESSION_SECRET:-airbnb_production_secret_change_me}
      KAFKA_BROKER: kafka:9092
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      NODE_OPTIONS: "--max-old-space-size=128"
    volumes:
      - sqlite_data:/data  # Share SQLite database with backend
    networks:
      - airbnb-network
    deploy:
      resources:
        limits:
          memory: 160M  # Reduced from 256MB
          cpus: '0.2'
        reservations:
          memory: 96M
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # Kafka Consumer Service
  kafka-consumer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airbnb-kafka-consumer
    command: ["node", "src/kafka/consumer-service.js"]
    environment:
      NODE_ENV: production
      DB_TYPE: sqlite
      KAFKA_BROKER: kafka:9092
      NODE_OPTIONS: "--max-old-space-size=128"
    volumes:
      - sqlite_data:/data  # Share SQLite database with backend
    networks:
      - airbnb-network
    deploy:
      resources:
        limits:
          memory: 160M  # Reduced from 256MB
          cpus: '0.2'
        reservations:
          memory: 96M
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # AI Agent Service (Using OpenAI API - lightweight)
  ai-agent:
    build:
      context: ./ai-agent
      dockerfile: Dockerfile
    container_name: airbnb-ai-agent
    ports:
      - "8000:8000"
    environment:
      BACKEND_URL: http://backend:5000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-airbnb_internal_key_2024}
      # OpenAI API (uses external API, very light on resources)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-3.5-turbo}
      OPENAI_TEMPERATURE: ${OPENAI_TEMPERATURE:-0.3}
      OPENAI_MAX_TOKENS: ${OPENAI_MAX_TOKENS:-1500}
    depends_on:
      - backend
    networks:
      - airbnb-network
    deploy:
      resources:
        limits:
          memory: 128M  # Reduced from 256MB (using API, not local model)
          cpus: '0.15'
        reservations:
          memory: 64M
    restart: unless-stopped

  # Frontend Service (React + Nginx - static files)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:5001}
        REACT_APP_AI_URL: ${REACT_APP_AI_URL:-http://localhost:8000}
    container_name: airbnb-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - airbnb-network
    deploy:
      resources:
        limits:
          memory: 64M  # Reduced from 128MB (just serving static files)
          cpus: '0.1'
        reservations:
          memory: 32M
    restart: unless-stopped

volumes:
  sqlite_data:
    driver: local
  mongodb_data:
    driver: local

networks:
  airbnb-network:
    driver: bridge

# OPTIMIZED Memory Usage (Bare Bones - with limits):
# - Zookeeper:     128MB  (reduced heap, minimal traffic)
# - Kafka:         256MB  (1hr log retention, small segments)
# - MongoDB:        96MB  (ultra-low cache, <100MB data, no journal)
# - Backend:       320MB  (Node.js heap limit 256MB)
# - Kafka Producer: 160MB (Node.js heap limit 128MB)
# - Kafka Consumer: 160MB (Node.js heap limit 128MB)
# - AI Agent:      128MB  (using OpenAI API, not local model)
# - Frontend:       64MB  (static files only via Nginx)
# ═══════════════════════════════════════════════════
# TOTAL:          ~1.3GB  (fits comfortably in t2.small/t2.micro!)
# 
# Benefits:
# - ✅ Fits in t2.micro FREE TIER (1GB + swap)
# - ✅ Runs smoothly on t2.small with plenty of headroom
# - ✅ Optimized for low traffic / bare bones usage
# - ✅ Can even run without swap on t2.small
#
# To disable AI Agent (saves additional 128MB):
# docker-compose -f docker-compose.ec2.yml up -d --scale ai-agent=0

